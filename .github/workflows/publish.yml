name: Threads 排程發文

on:
  schedule:
    # GitHub 用 UTC：04:17 = 台北 12:17，13:17 = 台北 21:17（避開整點排程壅塞）
    - cron: "17 4 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:

# 同時只跑一個，避免兩個工作搶同一篇
concurrency:
  group: threads-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests

      # 預設試跑；在 repo 的 Variables 設 THREADS_LIVE=true 才會真的發文
      - name: 發文
        run: python -m autopost publish ${{ vars.THREADS_LIVE == 'true' && '--live' || '' }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID || 'me' }}

      # 就算發文失敗也要把已寫入的狀態存回 repo，下次才不會重發
      - name: 存回佇列狀態
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.csv
          git diff --cached --quiet || (git commit -m "chore: 更新發文狀態" && git push)
